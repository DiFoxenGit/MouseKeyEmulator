<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="340" viewBox="0 0 1280 340" fill="none" role="img" aria-label="MouseKeyEmulator">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="340" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0d1017"/>
      <stop offset="0.55" stop-color="#141a2b"/>
      <stop offset="1" stop-color="#0e1220"/>
    </linearGradient>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7aa2ff"/>
      <stop offset="1" stop-color="#5b8cff"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#5b8cff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#5b8cff" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="1280" height="340" rx="20" fill="url(#bg)"/>
  <circle cx="1050" cy="150" r="260" fill="url(#glow)"/>

  <!-- dotted grid accent -->
  <g fill="#2a3350" opacity="0.6">
    <circle cx="60" cy="40" r="2"/><circle cx="100" cy="40" r="2"/><circle cx="140" cy="40" r="2"/>
    <circle cx="60" cy="80" r="2"/><circle cx="100" cy="80" r="2"/><circle cx="140" cy="80" r="2"/>
  </g>

  <!-- logo tile -->
  <g filter="url(#soft)">
    <rect x="72" y="112" width="116" height="116" rx="28" fill="url(#acc)"/>
    <text x="130" y="190" font-family="Segoe UI, Arial, sans-serif" font-size="52" font-weight="800" fill="#ffffff" text-anchor="middle">MK</text>
  </g>

  <!-- title + tagline -->
  <text x="220" y="150" font-family="Segoe UI, Arial, sans-serif" font-size="58" font-weight="800" fill="#eef2ff">MouseKeyEmulator</text>
  <text x="222" y="196" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="500" fill="#9fb0d6">Управляйте несколькими ПК с одного — по сети</text>

  <!-- pills -->
  <g font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="600">
    <g>
      <rect x="222" y="228" width="168" height="34" rx="17" fill="#1b2540" stroke="#2f3d63"/>
      <text x="306" y="250" fill="#9db4ff" text-anchor="middle">ESP32-S2 · USB HID</text>
    </g>
    <g>
      <rect x="402" y="228" width="150" height="34" rx="17" fill="#1b2540" stroke="#2f3d63"/>
      <text x="477" y="250" fill="#9db4ff" text-anchor="middle">Wi-Fi · программно</text>
    </g>
    <g>
      <rect x="564" y="228" width="120" height="34" rx="17" fill="#1b2540" stroke="#2f3d63"/>
      <text x="624" y="250" fill="#9db4ff" text-anchor="middle">до 10 ПК</text>
    </g>
  </g>

  <!-- flow illustration: host -> chip -> screens -->
  <g transform="translate(880,86)">
    <!-- host -->
    <rect x="0" y="70" width="96" height="66" rx="10" fill="#171b25" stroke="#33406a"/>
    <rect x="10" y="80" width="76" height="40" rx="4" fill="#0e1220" stroke="#2a3350"/>
    <rect x="34" y="136" width="28" height="8" rx="2" fill="#33406a"/>
    <text x="48" y="164" font-family="Segoe UI, Arial" font-size="13" fill="#7f8db0" text-anchor="middle">Хост</text>

    <!-- arrow -->
    <path d="M104 103 L150 103" stroke="url(#acc)" stroke-width="3" stroke-dasharray="5 5"/>
    <path d="M150 103 l-8 -5 l0 10 z" fill="#7aa2ff"/>

    <!-- chip -->
    <g transform="translate(160,74)">
      <rect x="0" y="0" width="58" height="58" rx="9" fill="url(#acc)"/>
      <rect x="12" y="12" width="34" height="34" rx="4" fill="#0e1220" opacity="0.55"/>
      <g stroke="#5b8cff" stroke-width="3">
        <line x1="-8" y1="14" x2="0" y2="14"/><line x1="-8" y1="29" x2="0" y2="29"/><line x1="-8" y1="44" x2="0" y2="44"/>
        <line x1="58" y1="14" x2="66" y2="14"/><line x1="58" y1="29" x2="66" y2="29"/><line x1="58" y1="44" x2="66" y2="44"/>
      </g>
      <text x="29" y="86" font-family="Segoe UI, Arial" font-size="13" fill="#7f8db0" text-anchor="middle">ESP32-S2</text>
    </g>

    <!-- arrow -->
    <path d="M240 103 L286 103" stroke="url(#acc)" stroke-width="3" stroke-dasharray="5 5"/>
    <path d="M286 103 l-8 -5 l0 10 z" fill="#7aa2ff"/>

    <!-- controlled screens -->
    <g transform="translate(296,64)">
      <rect x="0" y="0" width="70" height="46" rx="7" fill="#171b25" stroke="#33406a"/>
      <rect x="8" y="7" width="54" height="26" rx="3" fill="#12331f" stroke="#2a5f3a"/>
      <rect x="0" y="34" width="70" height="46" rx="7" fill="#171b25" stroke="#33406a" transform="translate(0,10)"/>
      <rect x="8" y="51" width="54" height="26" rx="3" fill="#12331f" stroke="#2a5f3a"/>
      <text x="35" y="104" font-family="Segoe UI, Arial" font-size="13" fill="#7f8db0" text-anchor="middle">Управляемые</text>
    </g>
  </g>
</svg>
